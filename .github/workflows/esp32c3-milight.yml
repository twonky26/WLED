name: Build ESP32-C3 MiLight

on:
  push:
    paths:
      - '**/*.cpp'
      - '**/*.h'
      - platformio.ini
      - usermods/**
      - .github/workflows/esp32c3-milight.yml
  pull_request:
    paths:
      - '**/*.cpp'
      - '**/*.h'
      - platformio.ini
      - usermods/**
      - .github/workflows/esp32c3-milight.yml
  workflow_dispatch:

jobs:
  build-esp32c3-milight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.buildcache
            build_output
          key: pio-${{ runner.os }}-esp32c3dev_milight-${{ hashFiles('platformio.ini', 'pio-scripts/output_bins.py') }}-${{ hashFiles('wled00/**', 'usermods/**') }}
          restore-keys: |
            pio-${{ runner.os }}-esp32c3dev_milight-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install PlatformIO
        run: pip install -r requirements.txt

      - name: Build ESP32-C3 MiLight
        run: pio run -e esp32c3dev_milight

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32c3dev_milight
          path: |
            build_output/release/*.bin
            build_output/release/*_ESP02*.bin.gz
